title: Sameiet Kirkeveien 90
description: En enkel hjemmeside for Sameiet Kirkeveien 90 som skal samle info som hyppig blir etterspurt
theme: just-the-docs
logo: assets/images/logo.png

url: https://www.kirkeveien90.no

#aux_links:
#Template Repository: https://github.com/just-the-docs/just-the-docs-template
#Kirkeveien: https://kirkeveien90.no

gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: "Rediger denne siden på GitHub."
gh_edit_branch: "main" # the branch that your docs is served from
gh_edit_repository: https://github.com/sameiet-kirkeveien-90/sameiet-kirkeveien-90.github.io
gh_edit_view_mode: "edit"

plugins:
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from

nav_external_links:
  - title: Solibo Beboerportal
    #url: https://home.solibo.no/hp/kirkeveien90
    url: https://beboer.kirkeveien90.no
    opens_in_new_tab: true
  - title: Facebookgruppe
    url: https://www.facebook.com/groups/kirkeveien90/
    opens_in_new_tab: true
  - title: Husordensregler (2026)
    url: /assets/pdfs/2026-husordensregler.pdf
    opens_in_new_tab: true
  - title: Vedtekter (2026)
    url: /assets/pdfs/2026-vedtekter.pdf
    opens_in_new_tab: true

# dette bestemmer farger for infobokser, etc
# ref https://just-the-docs.com/docs/configuration/#callouts
# ref https://just-the-docs.com/docs/ui-components/callouts/
callouts:
  info:
    title: Info
    color: blue
  highlight:
    color: yellow

sass:
  quiet_deps: true # https://github.com/just-the-docs/just-the-docs/issues/1541
  silence_deprecations: ["import"] # https://github.com/just-the-docs/just-the-docs/issues/1607
